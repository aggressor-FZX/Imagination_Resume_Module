[pytest]
# Phase 2: register pytest-asyncio so `@pytest.mark.asyncio` marks are honoured.
# Without this, async tests were collected as sync functions and always failed
# with "async def functions are not natively supported".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    slow: local document rendering; run separately from the fast gate
    live: real external API calls; skipped unless --run-live is provided with explicit environment credentials
filterwarnings =
    ignore::DeprecationWarning
